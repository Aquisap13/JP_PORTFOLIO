<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Laboratory</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="default-page">


    <!-- NAVIGATION -->

    <header class="navbar">

        <div class="logo">
            Laboratory Page
        </div>


        <nav id="mainNav">

            <a href="home.html">
                Home
            </a>

            <a href="quiz.html">
                Quiz
            </a>

            <a href="laboratory.html"
               class="active">
                Laboratory
            </a>

            <a href="exam.html">
                Exam
            </a>

        </nav>


        <button
            type="button"
            class="menu"
            id="menuButton"
            aria-label="Open Menu">

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>



    <!-- MAIN PAGE -->

    <main class="inner-page">


        <!-- PAGE INTRO -->

        <section class="page-intro">

            <span>
                ACADEMIC WORK
            </span>

            <h1>
                LABORATORY
            </h1>

            <p>
                View and access laboratory activities
                and academic outputs.
            </p>

        </section>



        <!-- PDF FILES -->

        <section class="submissions">


            <div class="submission-header">

                <h2>
                    My Laboratory PDF Files
                </h2>

                <span id="pdfCount">
                    0 files
                </span>

            </div>


            <div
                id="pdfList"
                class="pdf-list">

            </div>


        </section>



        <!-- PAGE NUMBER -->

        <div class="page-number">
            Page | 03
        </div>


    </main>



    <!-- JAVASCRIPT -->

    <script>

        const pdfFiles = [

            {
                name: "Laboratory 01",
                link: "pdfs/laboratory1.pdf"
            },

            {
                name: "Laboratory 02",
                link: "pdfs/laboratory2.pdf"
            },


        ];



        /* =====================================================
           GET ELEMENTS
        ===================================================== */


        const pdfList =
            document.getElementById("pdfList");


        const pdfCount =
            document.getElementById("pdfCount");


        const menuButton =
            document.getElementById("menuButton");


        const mainNav =
            document.getElementById("mainNav");



        /* =====================================================
           SHOW PDF FILES
        ===================================================== */


        function showPdfs() {


            pdfList.innerHTML = "";


            /* PDF COUNT */

            if (pdfFiles.length === 1) {

                pdfCount.textContent =
                    "1 file";

            } else {

                pdfCount.textContent =
                    pdfFiles.length + " files";

            }



            /* NO PDF */

            if (pdfFiles.length === 0) {


                const emptyBox =
                    document.createElement("div");


                emptyBox.className =
                    "no-submission";


                const emptyText =
                    document.createElement("p");


                emptyText.textContent =
                    "No PDF files available.";


                emptyBox.appendChild(
                    emptyText
                );


                pdfList.appendChild(
                    emptyBox
                );


                return;

            }



            /* DISPLAY PDF FILES */

            pdfFiles.forEach(
                function (pdf) {


                    const row =
                        document.createElement("div");


                    row.className =
                        "pdf-row";



                    /* PDF NAME */

                    const name =
                        document.createElement("span");


                    name.className =
                        "pdf-anchor";


                    name.textContent =
                        pdf.name;



                    /* VIEW BUTTON */

                    const viewButton =
                        document.createElement("a");


                    viewButton.href =
                        pdf.link;


                    viewButton.target =
                        "_blank";


                    viewButton.rel =
                        "noopener noreferrer";


                    viewButton.className =
                        "add-button";


                    viewButton.textContent =
                        "VIEW";



                    /* ADD TO ROW */

                    row.appendChild(
                        name
                    );


                    row.appendChild(
                        viewButton
                    );



                    /* ADD TO LIST */

                    pdfList.appendChild(
                        row
                    );

                }
            );

        }



        /* =====================================================
           LOAD PDF FILES
        ===================================================== */


        showPdfs();



        /* =====================================================
           MOBILE MENU
        ===================================================== */


        menuButton.addEventListener(
            "click",
            function () {

                mainNav.classList.toggle(
                    "show"
                );

            }
        );


    </script>


</body>

</html>
