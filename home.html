<!DOCTYPE html>
<html lang="en">

	<head>

		<meta charset="UTF-8" />

		<meta name="viewport"
			  content="width=device-width, initial-scale=1.0" />

		<title>Aquisap's Portfolio</title>

		<link rel="stylesheet"
			  href="style.css" />

		<style>

			/* =========================
			HOME IMAGE SIZE
			========================= */

			.hero {

			grid-template-columns: 38% 62%;

			}


			.hero-image {

			height: calc(100vh - 70px);

			display: flex;

			align-items: center;

			justify-content: center;

			padding: 40px;

			}


			.image-wrapper {

			width: 100%;

			height: 100%;

			max-width: 500px;

			overflow: hidden;

			}


			.hero-image img {

			width: 100%;

			height: 100%;

			object-fit: cover;

			object-position: center;

			filter: grayscale(100%);

			display: block;

			}


			/* =========================
			MOBILE
			========================= */

			@media (max-width: 1000px) {

			.hero {

			grid-template-columns: 40% 60%;

			}

			.hero-image {

			padding: 30px;

			}

			}


			@media (max-width: 700px) {

			.hero {

			display: block;

			min-height: auto;

			}


			.hero-image {

			height: 400px;

			padding: 25px;

			}


			.image-wrapper {

			max-width: 350px;

			}

			}


			@media (max-width: 450px) {

			.hero-image {

			height: 350px;

			padding: 20px;

			}

			}

		</style>

	</head>


	<body class="default-page">


		<!-- NAVIGATION -->

		<header class="navbar">

			<div class="logo">
				Home Page
			</div>


			<nav id="mainNav">

				<a href="home.html"
				   class="active">
					Home
				</a>

				<a href="quiz.html">
					Quiz
				</a>

				<a href="laboratory.html">
					Laboratory
				</a>

				<a href="exam.html">
					Exam
				</a>

			</nav>


			<button
				type="button"
				class="menu"
				id="menuButton"
				aria-label="Open Menu">

				<span></span>
				<span></span>
				<span></span>

			</button>

		</header>


		<!-- MAIN PORTFOLIO -->

		<main class="hero">


			<!-- LEFT PHOTO -->

			<section class="hero-image">

				<div class="image-wrapper">

					

					<img
						id="profileDisplay"
						src="profile.jpg"
						alt="Profile Photo" />

				</div>

			</section>


			<!-- RIGHT CONTENT -->

			<section class="hero-content">


				<div class="title-line">

					<h1>
						My
					</h1>

					<div></div>

				</div>


				<h1 class="portfolio-title">
					Portfolio
				</h1>


				<h2 id="displayName">
					John Paul Aquisap
				</h2>


				<p id="displayDetails">
20 years old, from Imus, Cavite. Currently a 3rd year BSIT student at Philippine Christian University (PCU) Dasmariñas.
				</p>


			</section>


			<!-- PAGE NUMBER -->

			<div class="page-number">
				Page | 01
			</div>


		</main>


		<!-- JAVASCRIPT -->

		<script>


			/* =========================
			MOBILE MENU
			========================= */

			const menuButton =
			document.getElementById(
			"menuButton"
			);


			const mainNav =
			document.getElementById(
			"mainNav"
			);


			if (menuButton) {

			menuButton.addEventListener(
			"click",
			function () {

			mainNav.classList.toggle(
			"show"
			);

			}
			);

			}

		</script>


	</body>

</html>
